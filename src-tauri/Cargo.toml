[package]
name = "bentossh"
version = "0.1.0"
description = "A modern, privacy-first SSH client built with Rust, Tauri, and SvelteKit."
authors = ["Pallab"]
edition = "2021"
keywords = ["ssh", "tauri", "terminal"]
categories = ["command-line-utilities"]

[[bin]]
name = "bentossh"
path = "src/main.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
tauri = { version = "2.0.0", features = ["devtools"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ssh2 = "0.9.4"
tokio = { version = "1.0", features = ["full", "sync", "time"] }
keyring = "3.0"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1.0"
uuid = { version = "1", features = ["v4"] }
lazy_static = "1.4"

[build-dependencies]
tauri-build = { version = "2.0.0", features = ["codegen"] }
